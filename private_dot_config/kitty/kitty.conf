color2 #00e8c6
color3 #cc5500
color4 #0096b1
color5 #c50ed2
color6 #06d6a0
color7 #c3c7d1
color8 #6d707b
color9 #ff3b5c
color10 #33f0d4
color11 #e6681a
color12 #1cb1cc
color13 #dd3ee8
