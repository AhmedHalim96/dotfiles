[main]
font=FiraCode Nerd Font:size=11
prompt="❯ "
placeholder=Search apps...
icon-theme=Papirus
icons-enabled=yes
fields=filename,name,generic,exec,keywords
match-mode=fzf
show-actions=yes

# Geometry & Padding
lines=15
width=60
horizontal-pad=18
vertical-pad=12
inner-pad=8
line-height=24
image-size-ratio=0.5

# Window Placement & Shell Behavior
anchor=center
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

# Terminal launcher integration
terminal=kitty -e

[colors]
# Custom Dark GTK Palette (RRGGBBAA format)
background=161925ff
text=C3C7D1ff
prompt=c50ed2ff
placeholder=6d707bff
input=fefefeff
match=00e8c6ff
selection=202436ff
selection-text=fefefeff
selection-match=00e8c6ff
counter=6d707bff
border=c50ed2ff

[border]
width=2
radius=12
selection-radius=6

[dmenu]
mode=text
exit-immediately-if-empty=no

[key-bindings]
# Unmap default forward line deletion to reuse Ctrl+k for Vim navigation
delete-line-forward=none

# Vim / Emacs navigation shortcuts
next=Down Control+n Control+j
prev=Up Control+p Control+k
execute=Return KP_Enter
cancel=Escape Control+c
