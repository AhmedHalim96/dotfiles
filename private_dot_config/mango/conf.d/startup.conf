#################
### AUTOSTART ###
#################

# --- 1. Environment & Essential Bridges ---
exec_once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once = xrdb -load ~/.config/X11/Xresources
exec_once = systemctl --user start hyprpolkitagent
exec_once = gnome-keyring-daemon --start --components=secrets,ssh,pkcs11

# --- 2. Desktop Shell (Dank Material Shell) ---
exec_once = ~/.config/eww/scripts/start-bar.sh

# --- 3. System Services & Background Daemons ---
exec_once = udiskie -t -f strata
exec_once = appimagelauncherd
exec_once = playerctld
exec_once = eww daemon
exec_once = awww-daemon
#exec-once = wayvnc -o "HDMI-A-1"


# --- 4. Apps (Start in background/tray) ---
exec_once = sleep 5 && persepolis --tray
exec_once = sleep 5 && qbittorrent
exec_once = sleep 5 && antimicrox --tray
exec_once = sleep 5 && easyeffects --gapplication-service
exec_once = sleep 5 && variety
exec_once = sleep 5 && copyq
exec_once = sleep 5 && kdeconnect-indicator
exec_once = sleep 5 && strata --gapplication-service

# --- 5. Custom Scripts,  Watchers, widgets ---
#exec-once = file-watcher --daemon
