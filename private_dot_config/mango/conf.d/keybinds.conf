# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

keymode=common
# reload config
bind=SUPER+CTRL,r,reload_config
#open mango config
bind=SUPER+SHIFT,period,spawn,code ~/.config/mango

keymode=default
# menu and terminal
bind=SUPER, r, spawn, walker --provider runner -p "run:"
bind=SUPER, p, spawn, walker --provider desktopapplications
bind=SUPER, y, spawn, run-cmd
bind=SUPER,Return,spawn,kitty

# exit
bind=SUPER+SHIFT,q,quit
bind=SUPER,q,killclient,

# apps
bind=SUPER, b,spawn, floorp
bind=SUPER,period,spawn, conf-editor
bind=SUPER+SHIFT,period,spawn,zeditor ~/.config/mango
bind=SUPER, c, spawn, copyq toggle
bind=SUPER, e, spawn, nemo
bind=SUPER, w, spawn, zopen
bind=SUPER+SHIFT, d, toggle_named_scratchpad,io.github.cboxdoerfer.FSearch,fsearch,fsearch

#other
bind=NONE,Print, spawn, noctalia msg screenshot-region

# switch window focus
bind=alt,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,togglejump,
bind=SUPER, a,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
#bind=alt,f,togglefakefullscreen,
bind=SUPER,n,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,N,restore_minimized
bind=SUPER,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=alt, space,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=SUPER, bracketleft,focusmon,left
bind=SUPER, bracketright,focusmon,right
bind=SUPER+SHIFT, bracketleft,tagmon,left
bind=SUPER+SHIFT, bracketright,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,l,resizewin,+50,+0


# Media keys
bind=NONE,XF86AudioRaiseVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp, spawn, brightnessctl s 10%+
bind=NONE,XF86MonBrightnessDown, spawn, brightnessctl s 10%-
bind=NONE,XF86PowerOff, spawn, ~/.config/rofi/scripts/powermenu.sh
bind=NONE,XF86AudioNext, spawn, playerctl -p playerctld next
bind=NONE,XF86AudioPause, spawn, playerctl -p playerctld play-pause
bind=NONE,XF86AudioPlay, spawn, playerctl -p playerctld play-pause
bind=NONE,XF86AudioPrev, spawn, playerctl -p playerctld previous


# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# key modes
bind=SUPER+SHIFT, m, setkeymode, media
bind=SUPER+SHIFT, a, setkeymode, apps

# Media
keymode=media
bind=NONE, h, spawn, playerctl -p playerctld position 10-
bind=NONE, l, spawn, playerctl -p playerctld position 10+
bind=NONE, j , spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE, k, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE, space, spawn, playerctl -p playerctld play-pause
bind=NONE, r, spawn, playerctl -p playerctld loop
bind=NONE, z, spawn, playerctl -p playerctld shuffle
bind=NONE, n, spawn, playerctl -p playerctld next
bind=NONE, p, spawn, playerctl -p playerctld previous
bind=NONE, Caps_Lock,setkeymode,default


# Window Management
keymode=apps
bind=NONE, s, spawn, smplayer
bind=NONE, e, spawn, evolution
bind=NONE, Caps_Lock, setkeymode, default
