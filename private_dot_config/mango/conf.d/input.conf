#################################################
# Input configuration
# https://mangowm.github.io/docs/configuration/input
#################################################

# keyboard
repeat_rate=50
repeat_delay=500
numlockon=1
xkb_rules_layout=us,ara
xkb_rules_options=grp:win_space_toggle,caps:swapescape

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
mouse_left_handed=0
mouse_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
